<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรียนจีน HSK 1–3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F7FC; --surface:#FFFFFF; --soft:#F7FAFD; --ink:#26323F; --muted:#64748A; --line:#DCE6F0;
  --teal:#159C83; --teal-soft:#DDF4EE; --coral:#EE6A55; --coral-soft:#FDE6E1; --sun:#F4B73A; --sun-soft:#FEF3D9; --violet:#7C6BD6; --violet-soft:#ECE9FB;
  --l1:#2F86D8; --l1s:#E2EFFC; --l2:#23A065; --l2s:#DFF4E9; --l3:#E0821C; --l3s:#FDEBD6; --l4:#8A6AD0; --l4s:#EEE8FB;
  --hz:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ui:"Noto Sans Thai","Sukhumvit Set","Leelawadee UI",Tahoma,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1D2430; --surface:#262F3D; --soft:#2C3646; --ink:#E8EDF4; --muted:#A3AFC0; --line:#3A4658;
  --teal-soft:#1F3E3A; --coral-soft:#46302E; --sun-soft:#463C25; --violet-soft:#35304F;
  --l1s:#24384F; --l2s:#21402F; --l3s:#4A3620; --l4s:#382F50; } }
:root[data-theme="dark"]{
  --bg:#1D2430; --surface:#262F3D; --soft:#2C3646; --ink:#E8EDF4; --muted:#A3AFC0; --line:#3A4658;
  --teal-soft:#1F3E3A; --coral-soft:#46302E; --sun-soft:#463C25; --violet-soft:#35304F;
  --l1s:#24384F; --l2s:#21402F; --l3s:#4A3620; --l4s:#382F50; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.65}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.hz{font-family:var(--hz)}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--hz);font-weight:700;font-size:26px}
.brand h1{margin:0;font-size:20px;line-height:1.2}
.brand p{margin:0;font-size:14px;color:var(--muted)}
.themebtn{white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}

.today{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--sun-soft);border-radius:20px;padding:20px 22px;margin-bottom:16px}
.today .big{background:var(--surface);border:0;border-radius:18px;min-width:110px;height:110px;padding:0 16px;font-family:var(--hz);font-size:52px;font-weight:500;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--sun)}
.today .lab{font-size:14px;color:var(--muted)}
.today .py{font-size:24px;font-weight:500;color:var(--teal)}
.today .th{font-size:19px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.pc{background:var(--surface);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.pc b{font-size:15px}.pc span{font-size:13px;color:var(--muted);display:block}
.bar{height:7px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}

nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
nav.tabs button{flex:none;border:0;border-radius:999px;padding:9px 18px;background:var(--surface);cursor:pointer;font-weight:500;color:var(--muted);border:1px solid var(--line)}
nav.tabs button[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select,input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input[type=search]{flex:1;min-width:170px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip input{margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.go{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.no{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.btn.vi{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.btn:disabled{opacity:.45;cursor:default}
.icon{width:36px;height:36px;border-radius:50%;border:0;background:var(--teal-soft);color:var(--teal);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.icon svg{width:16px;height:16px;fill:currentColor}
.muted{color:var(--muted)}
.box{background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:20px}

/* level picker */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 20px}
.lvcard{border:0;border-radius:22px;padding:22px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.lvcard .big{font-size:34px;font-weight:700;line-height:1}
.lvcard .d{font-size:14px;color:var(--muted)}
.lvcard.k1{background:var(--l1s)} .lvcard.k1 .big{color:var(--l1)}
.lvcard.k2{background:var(--l2s)} .lvcard.k2 .big{color:var(--l2)}
.lvcard.k3{background:var(--l3s)} .lvcard.k3 .big{color:var(--l3)}
.hello{font-size:22px;font-weight:700;margin:4px 0 2px}
.lvbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lvbar .cur{font-weight:700;font-size:18px;color:var(--acc)}
nav.tabs button[aria-selected="true"]{background:var(--acc)!important;border-color:var(--acc)!important}
@media (max-width:600px){.levels{grid-template-columns:1fr}}
/* pinyin */
.lvcard.k0{background:var(--violet-soft);grid-column:1/-1} .lvcard.k0 .big{color:var(--violet)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard,.pcard{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.tsvg{width:100%;height:auto;max-height:90px;background:var(--soft);border-radius:12px;margin-bottom:6px}
.tname{font-weight:700;color:var(--violet)} .tpy{font-size:26px;font-weight:700;color:var(--teal)} .tz{font-size:30px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.pl{font-size:28px;font-weight:700;color:var(--violet)} .rd{font-size:18px;font-weight:600;color:var(--teal)} .tr2{font-size:20px}
/* level tags */
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.lv1{background:var(--l1s);color:var(--l1)}.lv2{background:var(--l2s);color:var(--l2)}.lv3{background:var(--l3s);color:var(--l3)}.lv4{background:var(--l4s);color:var(--l4)}

/* lesson list */
.group{margin:6px 0 10px;font-size:16px;color:var(--muted);font-weight:500}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.lcard{text-align:left;border:0;border-radius:18px;padding:16px;cursor:pointer;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative}
.lcard .n{font-size:13px;font-weight:700}
.lcard .t{font-family:var(--hz);font-size:22px;font-weight:500}
.lcard .s{font-size:13px;color:var(--muted)}
.lcard.day .n{color:var(--l2)} .lcard.read .n{color:var(--violet)}
.lcard .done{position:absolute;top:12px;right:12px;font-size:12px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:1px 9px;font-weight:700}

/* lesson view */
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead h2{margin:0;font-family:var(--hz);font-size:28px;font-weight:500}
.part{font-size:16px;font-weight:700;color:var(--violet);margin:18px 0 10px}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:10px 0}
.msg.me{align-items:flex-end}
.who{font-size:13px;color:var(--muted);margin:0 8px 2px}
.bubble{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px}
.msg.me .bubble{background:var(--teal-soft);border-color:transparent;border-radius:18px 18px 6px 18px}
.para{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.line{font-family:var(--hz);font-size:22px;line-height:2.1}
.line ruby{ruby-position:over}
.line rt{font-family:var(--ui);font-size:12px;color:var(--muted);letter-spacing:0}
.nopy .line rt{display:none}
.nopy .line{line-height:1.8}
.w{cursor:pointer;border-radius:5px;padding:0 1px;border-bottom:3px solid transparent}
.colors .w{border-color:var(--line)} .colors .w.c4{border-color:transparent}
.colors.f1 .w.c1{border-color:var(--l1);background:var(--l1s)} .colors.f2 .w.c2{border-color:var(--l2);background:var(--l2s)} .colors.f3 .w.c3{border-color:var(--l3);background:var(--l3s)}
.w:hover{background:var(--sun-soft)}
.tr{font-size:15px;color:var(--muted);margin-top:4px}
.notr .tr{display:none}
.lineact{display:flex;gap:6px;align-items:center;margin-top:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.pop{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(30,50,80,.18);min-width:190px;max-width:280px}
.pop .ph{font-family:var(--hz);font-size:30px;line-height:1.2}
.pop .pp{color:var(--teal);font-weight:500}
.qa{margin:8px 0;padding:12px 14px;border-radius:14px;background:var(--violet-soft)}
.qa .q{font-family:var(--hz);font-size:19px}
.qa .a{font-family:var(--hz);font-size:17px;margin-top:6px;color:var(--violet)}

/* table */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.h{font-family:var(--hz);font-size:24px;white-space:nowrap}
td.p{color:var(--teal);font-weight:500;white-space:nowrap}
tr.known td.h{color:var(--muted)}
.hideth td.t span{filter:blur(6px);cursor:pointer}
.hideth td.t span.show{filter:none}
.hidepy td.p span{filter:blur(6px);cursor:pointer} .hidepy td.p span.show{filter:none}
.more{text-align:center;margin-top:12px}

/* flashcards */
.card{width:100%;border:0;border-radius:24px;min-height:300px;display:grid;place-items:center;text-align:center;padding:26px;cursor:pointer;background:var(--surface);border:1px solid var(--line);user-select:none}
.card.back{background:var(--teal-soft)}
.card .bigc{font-family:var(--hz);font-size:clamp(60px,15vw,104px);line-height:1.15}
.card .py{font-size:26px;color:var(--teal);font-weight:500;margin-top:8px}
.card .th{font-size:22px}
.card .en{font-size:14px;color:var(--muted);margin-top:4px}
.cardbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* quiz */
.prompt{text-align:center;margin-bottom:18px}
.prompt .bigc{font-family:var(--hz);font-size:clamp(54px,13vw,88px);line-height:1.15}
.prompt .thq{font-size:24px;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:14px;cursor:pointer;font-size:18px}
.opt.hzopt{font-family:var(--hz);font-size:28px}
.opt.right{background:var(--l2s);border-color:var(--l2)} .opt.wrong{background:var(--coral-soft);border-color:var(--coral)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;text-align:center}
.score{font-size:54px;font-weight:700;color:var(--teal);line-height:1.2;text-align:center}
.playbig{width:90px;height:90px;border-radius:50%;border:0;background:var(--coral);color:#fff;cursor:pointer;display:inline-grid;place-items:center}
.playbig svg{width:34px;height:34px;fill:currentColor}

/* typing */
.tprompt{font-size:22px;font-weight:500;margin:6px 0 14px}
.tin{width:100%;font-size:22px;font-family:var(--hz);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft)}
.res{margin-top:14px;padding:14px;border-radius:14px}
.res.ok{background:var(--l2s)} .res.mid{background:var(--sun-soft)} .res.bad{background:var(--coral-soft)}
.res .ans{font-family:var(--hz);font-size:22px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;z-index:30}
.toast.on{opacity:1}
@media (max-width:600px){
  .today{grid-template-columns:1fr}
  .prog{gap:6px}.pc{padding:8px 10px}.pc span{font-size:12px}
  .today .big{height:96px;font-size:46px}
  .opts{grid-template-columns:1fr}
  .line{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">学</div><div><h1>เรียนจีน HSK 1–3</h1><p>หลักสูตร HSK ใหม่ปี 2025 ระดับ 1–3</p></div></div>
    <button class="themebtn" id="themeBtn">โหมดกลางคืน</button>
  </header>
  <div id="home"></div>
  <div id="pinyin" hidden></div>
  <div id="inlevel" hidden>
  <div class="lvbar"><button class="btn" id="chLv">เปลี่ยนระดับ</button><span class="cur" id="curLv"></span><span class="muted" id="curProg"></span></div>
  <section class="today" id="today"></section>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="lessons" aria-selected="true">บทเรียน</button>
    <button role="tab" data-tab="vocab" aria-selected="false">คำศัพท์</button>
    <button role="tab" data-tab="cards" aria-selected="false">แฟลชการ์ด</button>
    <button role="tab" data-tab="quiz" aria-selected="false">ทดสอบ</button>
    <button role="tab" data-tab="type" aria-selected="false">ฝึกแปล</button>
  </nav>
  <main id="main"></main>
  </div>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W = D.words; const BY = {}; W.forEach(w=>BY[w.h]=w);
const LESSONS = D.lessons;
const LVN = {1:'HSK1',2:'HSK2',3:'HSK3',4:'นอก HSK3'};
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const plain=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v').replace(/[^a-z0-9v]/gi,'').toLowerCase();
const tag=l=>`<span class="lv lv${l}">${LVN[l]}</span>`;
const thOf=w=>w.t||w.en||'';

/* storage */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let known=new Set(load('hsk-known-v2',[]));
if(!known.size){ const old=load('hsk2-known-v1',[]); old.forEach(i=>{const h=D.oldIdx[i]; if(h) known.add(h);}); }
let doneL=new Set(load('hsk-lessons-done',[]));
const saveKnown=()=>{save('hsk-known-v2',[...known]); renderProg();};

/* theme */
let theme=load('hsk-theme','light');
function applyTheme(){document.documentElement.dataset.theme=theme;$('#themeBtn').textContent=theme==='light'?'โหมดกลางคืน':'โหมดกลางวัน';}
$('#themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';save('hsk-theme',theme);applyTheme();};
applyTheme();

/* toast + speech (Microsoft Yaoyao first) */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800);}
let voice=null, warned=false;
function pickVoice(){ if(!('speechSynthesis' in window))return; const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/yaoyao/i.test(v.name))||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null; }
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate){
  if(!('speechSynthesis' in window)){toast('เบราว์เซอร์นี้อ่านออกเสียงไม่ได้');return;}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=rate||0.85; if(voice)u.voice=voice; speechSynthesis.speak(u);
  if(!warned && speechSynthesis.getVoices().length && !(voice&&/yaoyao/i.test(voice.name))){warned=true;toast(voice?'ไม่พบเสียง Yaoyao ในเครื่องนี้ จึงใช้เสียงจีนอื่นแทน':'ไม่พบเสียงภาษาจีนในเครื่อง ติดตั้งเสียง Microsoft Yaoyao ในการตั้งค่า');}
}

/* Claude helper (optional) */
let samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);

/* today + progress */
function renderToday(){
  const pool=W.filter(w=>w.l===S.level); const d=new Date(); const day=Math.floor(d/864e5);
  const w=pool[(day*131)%pool.length];
  $('#today').innerHTML=`<button class="big" id="tdBtn" aria-label="ฟังเสียง">${esc(w.h)}</button>
    <div><div class="lab">คำของวันนี้ ${tag(w.l)} แตะตัวอักษรเพื่อฟังเสียง</div><div class="py">${esc(w.p)}</div><div class="th">${esc(thOf(w))}</div></div>`;
  $('#tdBtn').onclick=()=>speak(w.h);
}
function lvStats(l){const all=W.filter(w=>w.l===l),k=all.filter(w=>known.has(w.h)).length;return{n:all.length,k,p:Math.round(k/all.length*100)};}
function renderProg(){ if(S.level){const st=lvStats(S.level);$('#curProg').textContent=`จำได้ ${st.k} จาก ${st.n} คำ`;} if(!S.level) renderHome(); }
function renderHome(){
  const desc={1:'เริ่มจากศูนย์ คำพื้นฐานในชีวิตประจำวัน',2:'ต่อยอดประโยคยาวขึ้น พูดเรื่องรอบตัวได้',3:'คุยเรื่องการเรียน งาน และการเดินทาง'};
  $('#home').innerHTML=`<div class="hello">วันนี้จะเรียนระดับไหนดี</div><p class="muted" style="margin-top:0">แต่ละระดับมีบทเรียน คำศัพท์ และแบบฝึกของตัวเอง</p>
  <div class="levels"><button class="lvcard k0" id="goPy"><span class="big">เริ่มที่นี่: พินอิน</span><span>วรรณยุกต์ 4 เสียง พยัญชนะต้น และสระ</span><span class="d">สำหรับคนที่เพิ่งเริ่มจากศูนย์ ใช้เวลาประมาณ 1–2 วัน</span></button>${[1,2,3].map(l=>{const st=lvStats(l),nl=LESSONS.filter(x=>x.lv===l).length;
    return `<button class="lvcard k${l}" data-lv="${l}"><span class="big">HSK${l}</span><span>${st.n} คำ ${nl} บทเรียน</span><span class="d">${desc[l]}</span>
    <span class="d">จำได้ ${st.k} คำ (${st.p}%)</span><div class="bar" style="width:100%"><i style="width:${st.p}%;background:var(--l${l})"></i></div></button>`;}).join('')}</div>`;
  $$('.lvcard[data-lv]').forEach(b=>b.onclick=()=>enterLevel(+b.dataset.lv)); $('#goPy').onclick=enterPinyin;
}
function enterLevel(l){S.level=l;save('hsk-level',l);S.lesson=null;S.set='all';S.tsrc='all';
  document.documentElement.style.setProperty('--acc',`var(--l${l})`);
  $('#home').hidden=true;$('#inlevel').hidden=false;$('#curLv').textContent='HSK'+l;
  renderToday();renderProg();go('lessons');window.scrollTo(0,0);}
function leaveLevel(){S.level=null;save('hsk-level',null);closePop();$('#inlevel').hidden=true;$('#pinyin').hidden=true;$('#home').hidden=false;renderHome();window.scrollTo(0,0);}
function renderProgOld(){
  const col={1:'var(--l1)',2:'var(--l2)',3:'var(--l3)'};
  $('#prog').innerHTML=[1,2,3].map(l=>{const all=W.filter(w=>w.l===l),k=all.filter(w=>known.has(w.h)).length,p=Math.round(k/all.length*100);
    return `<div class="pc"><b>${LVN[l]}</b><span>จำได้ ${k} จาก ${all.length} คำ</span><div class="bar"><i style="width:${p}%;background:${col[l]}"></i></div></div>`;}).join('');
}

/* shared selectors */
const S={level:null,tab:'lessons',lesson:null,showPy:true,showTr:true,colors:true,
  lv:'2',set:'all',q:'',hideTh:false,limit:120,onlyNew:false,deck:[],di:0,flip:false,
  qmode:'zh-th',quiz:null,tsrc:'all',tkind:'sent',tlist:[],ti:0,tstate:null,tscore:0};
const SET=20;
function lvPool(){return W.filter(w=>w.l===S.level);}
function pool(){const p=lvPool(); if(S.set==='all')return p; const s=+S.set; return p.slice(s*SET,s*SET+SET);}
function lvSelect(){return '';}
function lvSelectOld(){return `<select id="lvSel" aria-label="ระดับ">${['1','2','3','all'].map(v=>`<option value="${v}"${S.lv===v?' selected':''}>${v==='all'?'ทุกระดับ':'HSK'+v}</option>`).join('')}</select>`;}
function setSelect(){const p=lvPool(),n=Math.ceil(p.length/SET);let o=`<option value="all">ทุกคำ (${p.length})</option>`;
  for(let s=0;s<n;s++){const sl=p.slice(s*SET,s*SET+SET),k=sl.filter(w=>known.has(w.h)).length;o+=`<option value="${s}"${S.set===String(s)?' selected':''}>ชุดที่ ${s+1} (${k}/${sl.length})</option>`;}
  return `<select id="setSel" aria-label="ชุดคำ">${o}</select>`;}
function bindSel(re){ const a=$('#lvSel'); if(a) a.onchange=e=>{S.lv=e.target.value;S.set='all';re();}; const b=$('#setSel'); if(b) b.onchange=e=>{S.set=e.target.value;re();}; }

/* ===== lessons ===== */
function renderLessons(){
  if(S.lesson) return renderLesson(S.lesson);
  const card=l=>`<button class="lcard ${l.kind}" data-id="${l.id}">${doneL.has(l.id)?'<span class="done">อ่านแล้ว</span>':''}
    <span class="n">${l.kind==='day'?'Day '+l.n:'บทอ่านที่ '+l.n}</span><span class="t">${esc(l.title)}</span>
    <span class="s">${l.vocab.filter(v=>v[2]===S.level).length} คำ HSK${S.level} ${l.blocks.some(b=>b.k==='j'||b.k==='me')?'มีบทสนทนา + บทความ':'บทความ'}</span></button>`;
  const mine=LESSONS.filter(l=>l.lv===S.level), reads=mine.filter(l=>l.kind==='read');
  $('#main').innerHTML=`<div class="group">บทเรียนรายวัน: แชทแบบเพื่อนคุยกัน + บทความ (วันละประมาณ 25 คำ)</div>
    <div class="lgrid">${mine.filter(l=>l.kind==='day').map(card).join('')}</div>
    ${reads.length?`<div class="group">บทอ่าน</div><div class="lgrid">${reads.map(card).join('')}</div>`:''}`;
  $$('.lcard').forEach(b=>b.onclick=()=>{S.lesson=b.dataset.id;renderLessons();window.scrollTo(0,0);});
}
function lineHTML(t){return t.map(x=>{ if(!Array.isArray(x)) return esc(x);
  const [h,py,l,m]=x; return `<span class="w c${l}" data-h="${esc(h)}" data-p="${esc(py)}" data-l="${l}" data-m="${esc(m)}" tabindex="0" role="button"><ruby>${esc(h)}<rt>${esc(py)}</rt></ruby></span>`;}).join('');}
const plainLine=t=>t.map(x=>Array.isArray(x)?x[0]:x).join('');
function renderLesson(id){
  const L=LESSONS.find(l=>l.id===id);
  let html=`<div class="lhead"><button class="btn" id="back">กลับ</button><h2>${esc(L.title)}</h2><span class="muted">HSK${L.lv} ${L.kind==='day'?'Day '+L.n:'บทอ่านที่ '+L.n}</span></div>

let popEl=null;

function openPop(w){
  closePop(); const h=w.dataset.h, l=+w.dataset.l, entry=BY[h];
  const m=w.dataset.m||(entry&&thOf(entry))||'';
  popEl=document.createElement('div');popEl.className='pop';

/* ===== typing practice ===== */
const MARK={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function numToMark(s){return s.replace(/v/g,'ü').replace(/([a-zü]+?)([1-5])/g,(m,syl,t)=>{t=+t;if(t===5)return syl;let i=-1;
  if(syl.includes('a'))i=syl.indexOf('a');else if(syl.includes('e'))i=syl.indexOf('e');else if(syl.includes('ou'))i=syl.indexOf('o');
  else for(let k=syl.length-1;k>=0;k--){if('iouü'.includes(syl[k])){i=k;break;}} return i<0?syl:syl.slice(0,i)+MARK[syl[i]][t-1]+syl.slice(i+1);});}
const strip=s=>s.replace(/[\s'’‘"“”·,.?!;:，。？！、；：…]/g,'');
function check(ans,it){
  const a=strip(ans); if(!a) return null;
  if(a===strip(it.hz)) return 'ok';
  const ap=strip(numToMark(ans.toLowerCase())), tp=strip(it.py.toLowerCase());
  if(ap===tp) return 'ok';
  if(plain(ap)===plain(tp)) return /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(ap)?'tone':'notone';
  return 'bad';
}
function tSource(){
  const ls=S.tsrc==='all'?LESSONS.filter(l=>l.lv===S.level):LESSONS.filter(l=>l.id===S.tsrc);
  if(S.tkind==='sent') return ls.flatMap(l=>l.sents.map(s=>({th:s[0],hz:s[1],py:s[2]})));
  const seen=new Set(); return ls.flatMap(l=>l.vocab).filter(v=>v[2]===S.level&&!seen.has(v[0])&&seen.add(v[0])).map(v=>({th:v[3],hz:v[0],py:v[1]}));
}

  const st=S.tstate;
  $('#main').innerHTML=head+`<div class="box"><div class="muted">ข้อ ${S.ti+1} จาก ${S.tlist.length} ถูก ${S.tscore} ข้อ</div>

    <div class="controls" style="margin-top:12px">${st?`<button class="btn go" id="tnext">ข้อต่อไป</button>`:`<button class="btn go" id="tcheck">ตรวจคำตอบ</button><button class="btn" id="tskip">ดูเฉลย</button>`}</div>
    <div id="tres">${st?resHTML(st,it):''}</div></div>`;
  bindType();
  if(!st){const inp=$('#tin');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)doCheck();};$('#tcheck').onclick=doCheck;$('#tskip').onclick=()=>{S.tstate={r:'bad',ans:'',msg:'เฉลย'};renderType();speak(it.hz);};}
  else {$('#tnext').onclick=()=>{S.ti++;S.tstate=null;renderType();};$('#tnext').focus();
    const ai=$('#askAI'); if(ai) ai.onclick=()=>askClaude(it,st);

function resHTML(st,it){
  const cls=st.r==='ok'?'ok':st.r==='bad'?'bad':'mid';
  return `<div class="res ${cls}"><b>${esc(st.msg)}</b>${st.note?`<div>${esc(st.note)}</div>`:''}
    <div class="ans" style="margin-top:6px">${esc(it.hz)} <button class="icon" data-say="${esc(it.hz)}" aria-label="ฟัง">${PLAY}</button></div><div style="color:var(--teal)">${esc(it.py)}</div>
    ${st.r==='bad'&&st.ans&&S.tkind==='sent'&&st.ai!==false&&window.claude?`<div style="margin-top:10px"><button class="btn vi" id="askAI">ให้ Claude ช่วยดูว่าคำตอบของฉันใช้ได้ไหม</button></div>`:''}
    ${st.aiText?`<div style="margin-top:10px;white-space:pre-wrap">${esc(st.aiText)}</div>`:''}</div>`;

function doCheck(){const it=S.tlist[S.ti],ans=$('#tin').value; const r=check(ans,it); if(!r){$('#tin').focus();return;}
  const msg={ok:'ถูกต้อง',notone:'ถูกต้อง',tone:'เกือบถูก',bad:'ยังไม่ตรงกับเฉลย'}[r];
  const note={notone:'ตัวสะกดถูก แต่ยังไม่ได้ใส่วรรณยุกต์',tone:'ตัวสะกดถูก แต่วรรณยุกต์ยังไม่ตรง',bad:(window.claude?'ประโยคภาษาจีนพูดได้หลายแบบ ถ้าคิดว่าคำตอบของคุณก็ถูก กดให้ Claude ช่วยดูได้':'ประโยคภาษาจีนพูดได้หลายแบบ ลองเทียบกับเฉลยด้านล่าง')}[r];
  if(r==='ok'||r==='notone')S.tscore++;
  S.tstate={r,ans,msg,note}; speak(it.hz); renderType();}
async function askClaude(it,st){
  const sample=await samplePromise; if(!sample){st.ai=false;st.aiText='ฟีเจอร์นี้ใช้ไม่ได้ในหน้านี้';renderType();return;}
  st.aiText='กำลังตรวจ...';renderType();
  try{const res=await sample(`คุณเป็นครูสอนภาษาจีนให้คนไทยระดับ HSK2 ตอบเป็นภาษาไทยสั้น ๆ ไม่เกิน 4 บรรทัด
ประโยคไทย: ${it.th}
เฉลย: ${it.hz}
คำตอบของนักเรียน: ${st.ans}
บอกว่าคำตอบของนักเรียนถูกต้องและเป็นธรรมชาติไหม (ภาษาพูดแบบเพื่อนคุยกันถือว่าดี) ถ้าผิดให้บอกจุดที่ผิดและวิธีแก้`,{modelTier:'quick'});
    if(res.text&&/^(ถูก|ใช้ได้)/.test(res.text.trim())&&st.r==='bad'){S.tscore++;st.r='mid';st.msg='Claude บอกว่าใช้ได้';}
    st.aiText=res.text;}catch(e){st.aiText=e&&e.code==='rate_limited'?'ใช้งานถี่เกินไป ลองใหม่อีกสักครู่':'ตรวจไม่สำเร็จ ลองใหม่อีกครั้ง'; if(e&&e.code==='not_granted')st.ai=false;}
  renderType();
}

const PS={sec:'tones',q:null,qmode:'tone'};
function toneOf(p){const m=p.normalize('NFD').match(/[\u0304\u0301\u030C\u0300]/g)||[];return m.map(c=>({'\u0304':1,'\u0301':2,'\u030C':3,'\u0300':4}[c]));}
const MONO=W.filter(w=>w.h.length===1&&!/\s/.test(w.p)&&toneOf(w.p).length===1);
const DUO=W.filter(w=>w.h.length===2&&toneOf(w.p).length===2);
function toneSvg(t,big){ if(!t.path) return `<svg viewBox="0 0 120 80" class="tsvg" aria-hidden="true"><circle cx="60" cy="48" r="7" fill="var(--violet)"/></svg>`;
  return `<svg viewBox="0 0 120 80" class="tsvg" aria-hidden="true">${[14,27,40,53,66].map(y=>`<line x1="8" x2="112" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`).join('')}<path d="${t.path}" fill="none" stroke="var(--violet)" stroke-width="6" stroke-linecap="round"/></svg>`;}

function newPyQuiz(){
  const mode=PS.qmode, pool=mode==='pair'?DUO:MONO;
  const items=shuffle(pool).slice(0,10).map(w=>{const t=toneOf(w.p);
    let opts; if(mode==='tone') opts=[1,2,3,4].map(String); else {const ans=t.join('-'),set=new Set([ans]);while(set.size<4)set.add((1+Math.floor(Math.random()*4))+'-'+(1+Math.floor(Math.random()*4)));opts=shuffle([...set]);}
    return {w,ans:mode==='tone'?String(t[0]):t.join('-'),opts,pick:null};});
  PS.q={items,n:0,score:0};
}
const toneLabel=s=>s.split('-').map(x=>'เสียง '+x).join(' + ');
function renderPyQuiz(){
  const Q=PS.q; const head=`<div class="controls"><select id="pyMode" aria-label="รูปแบบ"><option value="tone"${PS.qmode==='tone'?' selected':''}>ฟังคำพยางค์เดียว ทายเสียง</option><option value="pair"${PS.qmode==='pair'?' selected':''}>ฟังคำสองพยางค์ ทายเสียงคู่</option></select><button class="btn" id="pyRe">เริ่มใหม่</button></div>`;
  if(Q.n>=Q.items.length) return head+`<div class="box"><div class="score">${Q.score}/${Q.items.length}</div><p style="text-align:center">${Q.score>=8?'หูดีมาก ไปเริ่ม HSK1 ได้เลย':'ลองฟังหน้าวรรณยุกต์อีกรอบ แล้วกลับมาฝึกใหม่'}</p><p style="text-align:center"><button class="btn go" id="pyAgain">ฝึกอีกชุด</button></p></div>`;
  const it=Q.items[Q.n],done=it.pick!==null;
  return head+`<div class="box"><div class="muted">ข้อ ${Q.n+1} จาก ${Q.items.length} ได้ ${Q.score} คะแนน</div>
   <div class="prompt"><button class="playbig" id="pyPlay" aria-label="ฟังอีกครั้ง">${PLAY}</button><div class="muted">กดฟัง แล้วเลือกเสียงที่ได้ยิน</div></div>
   <div class="opts">${it.opts.map((o,k)=>{let c='opt';if(done&&o===it.ans)c+=' right';else if(done&&k===it.pick)c+=' wrong';
     return `<button class="${c}" data-k="${k}"${done?' disabled':''}>${PS.qmode==='tone'?'เสียงที่ '+o:toneLabel(o)}</button>`;}).join('')}</div>
   <div class="fb">${done?`<span class="hz" style="font-size:26px">${esc(it.w.h)}</span> <span style="color:var(--teal);font-size:20px">${esc(it.w.p)}</span> ${esc(thOf(it.w))}<p><button class="btn go" id="pyNext">${Q.n+1<Q.items.length?'ข้อต่อไป':'ดูผลคะแนน'}</button></p>`:''}</div></div>`;
}
function bindPyQuiz(){
  const Q=PS.q; $('#pyMode').onchange=e=>{PS.qmode=e.target.value;newPyQuiz();renderPinyin();};
  $('#pyRe').onclick=()=>{newPyQuiz();renderPinyin();};
  if($('#pyAgain')) $('#pyAgain').onclick=()=>{newPyQuiz();renderPinyin();};
  const it=Q.items[Q.n]; if(!it) return;
  $('#pyPlay').onclick=()=>speak(it.w.h,0.7);
  $$('#pinyin .opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;it.pick=k;if(it.opts[k]===it.ans)Q.score++;speak(it.w.h,0.7);renderPinyin();$('#pyNext').focus();});
  if($('#pyNext')) $('#pyNext').onclick=()=>{Q.n++;renderPinyin();const nx=Q.items[Q.n];if(nx)speak(nx.w.h,0.7);};
}
